<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f0eb">
  <title data-i18n="subscription">اشتراک</title>
  <meta name="referrer" content="no-referrer">
  <!-- Font notices are included below.
@FONT_NOTICE@
  -->
  <style>
@CSS@
  </style>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></symbol>
    <symbol id="diagonal" viewBox="0 0 24 24"><path d="M5 19 19 5M6.5 5H19v12.5"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="layers" viewBox="0 0 24 24"><path d="m12 2 10 6-10 6L2 8l10-6Zm10 11-10 6-10-6m20 4-10 6-10-6"/></symbol>
    <symbol id="copy" viewBox="0 0 24 24">
      <rect x="7.5" y="7.5" width="12.5" height="13" rx="2.5"/>
      <path d="M16.5 4.5a2.5 2.5 0 0 0-2-1H6A2.5 2.5 0 0 0 3.5 6v8.5a2.5 2.5 0 0 0 1 2"/>
    </symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
  </svg>

  <div class="page">
    <header class="masthead" aria-label="سربرگ اشتراک" data-i18n-label="headerLabel">
      <div class="masthead-top">
        <h1><span data-i18n="heading">اشتراک من</span><span class="title-dot" aria-hidden="true">.</span></h1>
        <div class="language-control">
          <svg class="icon language-globe" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <ellipse cx="12" cy="12" rx="4" ry="9"/>
            <path d="M3 12h18"/>
          </svg>
          <select id="language-select" aria-label="زبان" data-i18n-label="language">
            <option value="fa" lang="fa">فارسی</option>
            <option value="en" lang="en">English</option>
            <option value="ru" lang="ru">Русский</option>
            <option value="zh" lang="zh-Hans">简体中文</option>
          </select>
          <svg class="icon language-chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 10 5 5 5-5"/>
          </svg>
        </div>
      </div>
      <div class="masthead-title" aria-hidden="true"><span class="header-rule"></span></div>
    </header>

    <main>
      <div class="dashboard">
        <section class="overview" aria-labelledby="overview-title">
          <div class="split overview-meta">
            <div class="overview-heading">
              <h2 id="overview-title" data-i18n="subscription">اشتراک</h2>
              <span class="plan-state" id="plan-status">—</span>
            </div>
            <bdi id="subscription-id" class="latin" dir="ltr">—</bdi>
          </div>
          <div class="split overview-body">
            <div class="percentage">
              <p data-i18n="usagePercent">درصد مصرف</p>
              <strong class="percent-value" dir="ltr">
                <span id="percentage-number">—</span>
                <svg class="percent-symbol" viewBox="0 0 32 43" aria-hidden="true">
                  <circle cx="7.5" cy="8" r="4.6"/>
                  <path d="M6 40 27 2" stroke="currentColor" stroke-width="5.4"/>
                  <circle cx="24.5" cy="34.5" r="4.6"/>
                </svg>
                <span class="visually-hidden" data-i18n="percentSign">٪</span>
              </strong>
            </div>
            <div class="gauge" aria-hidden="true">
              <svg class="gauge-ring" viewBox="0 0 120 120">
                <circle class="gauge-track" cx="60" cy="60" r="54"/>
                <circle class="gauge-fill" cx="60" cy="60" r="54" pathLength="100"
                        stroke-dasharray="0 100" transform="rotate(-90 60 60)"/>
              </svg>
              
            </div>
          </div>
          <div class="usage-card">
            <p id="used-label" data-i18n="used">مصرف‌شده</p>
            <div class="usage-numbers">
              <bdi id="used-volume" class="latin used-value" dir="ltr">—</bdi>
              <span class="usage-total"><span data-i18n="outOf">از</span> <bdi id="total-volume" class="latin" dir="ltr">—</bdi></span>
            </div>
            <div class="progress-track" role="progressbar" aria-labelledby="used-label"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill"></div>
            </div>
          </div>
        </section>

        <section class="link-section" aria-labelledby="links-title">
          <div class="split section-heading">
            <h2 id="links-title" data-i18n="links">لینک‌های اشتراک</h2>
            
          </div>
          <div class="link-grid">
            <button class="link-button primary" type="button" hidden data-link="subscription"><span class="link-copy"><strong data-i18n="subscriptionLink">کپی لینک اشتراک</strong></span><svg class="icon" aria-hidden="true"><use href="#copy"/></svg></button>
            <button class="link-button" type="button" hidden data-link="mihomo"><span class="link-copy"><strong data-i18n="mihomoLink">کپی لینک کلش / Mihomo</strong></span><svg class="icon" aria-hidden="true"><use href="#copy"/></svg></button>
            <button class="link-button" type="button" hidden data-link="json"><span class="link-copy"><strong data-i18n="jsonLink">کپی لینک JSON</strong></span><svg class="icon" aria-hidden="true"><use href="#copy"/></svg></button>
          </div>
        </section>

        <section class="usage" aria-label="حجم و زمان باقی‌مانده" data-i18n-label="usageLabel">

          <div class="metrics">
            <div class="metric">
              <div class="split">
                <h3 data-i18n="remainingVolume">حجم باقی‌مانده</h3>
                <svg class="icon" aria-hidden="true"><use href="#layers"/></svg>
              </div>
              <bdi id="remaining-volume" class="latin metric-value" dir="ltr">—</bdi>
            </div>
            <div class="metric">
              <div class="split">
                <h3 data-i18n="remainingDays">روزهای باقی‌مانده</h3>
                <svg class="icon" aria-hidden="true"><use href="#clock"/></svg>
              </div>
              <strong id="remaining-days" class="metric-value">—</strong>
            </div>
          </div>
        </section>


      </div>

      <section class="configs" hidden aria-labelledby="configs-title">
        <div class="split section-heading">
          <h2 id="configs-title" data-i18n="configs">کانفیگ‌ها</h2>
          
        </div>
        <ol class="config-list"></ol>
        <template id="config-row">
          <li class="config-row split">
            <div class="config-name">
              <h3><span data-i18n="config">کانفیگ</span> <bdi class="latin" dir="ltr"></bdi></h3>
            </div>
            <button class="copy-button" type="button">
              <svg class="icon" aria-hidden="true"><use href="#copy"/></svg><span data-i18n="copy">کپی</span>
            </button>
          </li>
        </template>
      </section>
    </main>

    <footer class="split site-footer" hidden>
      <h2 data-i18n="help">به راهنمایی نیاز دارید؟</h2>
      <button class="support-link" id="support-link" type="button">
        <span data-i18n="support">تماس با پشتیبانی</span>
        <svg class="icon" aria-hidden="true"><use href="#diagonal"/></svg>
      </button>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="copy-dialog" class="copy-dialog" aria-labelledby="copy-dialog-title">
    <h2 id="copy-dialog-title" data-i18n="manualCopy">کپی دستی</h2>
    <label for="copy-value" data-i18n="selectText">متن را انتخاب و کپی کنید.</label>
    <textarea id="copy-value" dir="ltr" rows="3" readonly></textarea>
    <form method="dialog"><button type="submit" data-i18n="close">بستن</button></form>
  </dialog>
  <script>
@ADAPTER@
@JS@
  </script>
</body>
</html>
