:root {
  --page: #f1f0eb;
  --paper: #f8f7f2;
  --ink: #19171a;
  --overview: #272125;
  --white: #f8f5ef;
  --muted: #756e6b;
  --muted-on-dark: #b9afb2;
  --line: #d8d6ce;
  --track: #4c4246;
  --accent: #b73842;
  --accent-ink: #8b3e46;
  --accent-soft: #ebdcda;
  --gutter: clamp(24px, 3.06vw, 48px);
  --column-gap: clamp(24px, 2.6vw, 40px);
  --small-gap: 16px;
  --radius: 19px;
  --columns: minmax(0, 2fr) minmax(0, 2.875fr);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 16px/1.6 "Shabnam", Tahoma, sans-serif;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.latin { font-family: Arial, sans-serif; }
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.icon {
  display: block;
  flex: none;
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.page {
  width: min(100%, 1640px);
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.split {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.masthead {
  min-height: 117px;
  padding-block: 30px 32px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 15px; }
.brand h1 { font-size: 22px; line-height: 1.4; }
.brand-mark {
  display: grid;
  flex: none;
  place-items: center;
  width: 54px;
  height: 54px;
  color: var(--white);
  background: var(--overview);
  border-radius: 17px;
}
.brand-mark svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  flex: none;
  gap: 10px;
  min-height: 43px;
  padding: 4px 16px;
  border-radius: 999px;
  color: var(--accent-ink);
  background: var(--accent-soft);
  font-size: 15px;
  font-weight: 700;
}
.status-pill::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #a03d49;
}
.status-pill[data-active="false"] { color: var(--muted); background: #e8e4de; }
.status-pill[data-active="false"]::before { background: currentColor; }

main { padding-top: 31px; }
.dashboard, .link-section {
  display: grid;
  grid-template-columns: var(--columns);
  column-gap: var(--column-gap);
}
.dashboard { align-items: start; }
.overview {
  min-width: 0;
  min-height: 373px;
  display: flex;
  flex-direction: column;
  padding: 29px 32px 24px;
  color: var(--muted-on-dark);
  background: var(--overview);
  border-radius: 28px;
}
.overview h2 { font-size: inherit; font-weight: 400; }
.overview-meta bdi { font-size: 18px; overflow-wrap: anywhere; }
.overview-body { flex: 1; padding: 25px 0 25px 8px; }
.percentage { display: grid; gap: 14px; transform: translateY(-10px); }
.percent-value {
  position: relative;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.035em;
  color: var(--white);
  font-size: 86px;
  font-weight: 700;
  line-height: 1.08;
}
.percent-symbol {
  flex: none;
  width: 0.49em;
  height: 0.67em;
  fill: currentColor;
}
.gauge {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: clamp(112px, 10.42vw, 160px);
  aspect-ratio: 1;
  color: #d6b5b7;
}
.gauge-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.gauge-ring circle { fill: none; stroke-width: 7.4px; }
.gauge-track { stroke: #50454b; }
.gauge-fill { stroke: #d46f78; stroke-linecap: round; }
.gauge-arrow { width: 28px; height: 28px; stroke-width: 2; }
.overview-footer {
  border-top: 1px solid #4a4044;
  min-height: 46px;
  padding-top: 19px;
}

.section-heading h2 { font-size: 22px; line-height: 1.45; }
.section-heading p { color: var(--muted); font-size: 15px; }
.usage > .section-heading { min-height: 34px; margin-bottom: 18px; }
.usage-card {
  display: flex;
  flex-direction: column;
  min-height: 205px;
  padding: 24px 26px 38px;
  border-radius: var(--radius);
  color: var(--white);
  background: var(--ink);
}
.usage-card > p { color: var(--muted-on-dark); }
.usage-numbers {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 5px 12px;
  margin: 23px 0 19px;
}
.used-value { font-size: 48px; font-weight: 700; line-height: 1; }
.usage-total { font-size: 18px; white-space: nowrap; }
.progress-track {
  direction: ltr;
  height: 6px;
  margin-top: auto;
  background: var(--track);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  width: var(--progress, 25%);
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #d77b83, #f5b5a6);
}

.metrics, .link-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--small-gap);
}
.metrics { margin-top: 15px; }
.metric {
  min-width: 0;
  min-height: 176px;
  padding: 23px 25px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.metric h3 { color: var(--muted); font-size: 16px; font-weight: 400; }
.metric .icon { width: 22px; height: 22px; color: #afa6a2; }
.metric-value {
  display: block;
  width: fit-content;
  margin-top: 23px;
  font-size: 38px;
  font-weight: 700;
  line-height: 1.25;
}

.link-section { grid-column: 1 / -1; align-items: center; }
.link-section > .section-heading { margin-top: 20px; }
.link-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 100px;
  padding: 16px 25px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 17px;
  font-weight: 700;
  text-align: start;
  transition: background-color 160ms ease, border-color 160ms ease;
}

const expiry = {{ .expire }};
const totalBytes = {{ .totalByte }};
const usedBytes = {{ .uploadByte }} + {{ .downloadByte }};
const enabled = {{ .enabled }};
const remainingDays = daysLeft(expiry);
let status = enabled ? "فعال" : "غیرفعال";
if (remainingDays === 0) status = "منقضی";
else if (totalBytes > 0 && usedBytes >= totalBytes) status = "اتمام حجم";

const subscription = {
  id: {{ .sId }},
  status,
  usedGB: usedBytes / 1024 ** 3,
  totalGB: Math.max(0, totalBytes) / 1024 ** 3,
  remainingDays,
  links: {
    subscription: {{ .subUrl }},
    mihomo: {{ .subClashUrl }},
    json: {{ .subJsonUrl }},
  },
  configs: {{ .links }} ?? [],
  supportUrl: {{ .subSupportUrl }},
};

const persianNumber = new Intl.NumberFormat("fa-IR", { maximumFractionDigits: 1 });
const englishNumber = new Intl.NumberFormat("en", { maximumFractionDigits: 2 });
const toast = document.querySelector("#toast");
const copyDialog = document.querySelector("#copy-dialog");
const copyValue = document.querySelector("#copy-value");
const feedbackTimers = new WeakMap();
let toastTimer;

function renderSubscription(data) {
  const unlimited = data.totalGB === 0;
  const remaining = Math.max(0, data.totalGB - data.usedGB);
  const percent = data.totalGB > 0
    ? Math.min(100, Math.max(0, data.usedGB / data.totalGB * 100))
    : 0;
  const status = document.querySelector("#plan-status");
  const progress = document.querySelector(".progress-track");
  const gauge = document.querySelector(".gauge-fill");

  status.textContent = data.status;
  status.dataset.active = String(data.status === "فعال");
  document.querySelector("#subscription-id").textContent = data.id;
  document.querySelector("#percentage-number").textContent = unlimited ? "—" : persianNumber.format(percent);
  document.querySelector("#used-volume").textContent = englishNumber.format(data.usedGB) + " GB";
  document.querySelector("#total-volume").textContent = unlimited ? "نامحدود" : englishNumber.format(data.totalGB) + " GB";
  document.querySelector("#remaining-volume").textContent = unlimited ? "نامحدود" : englishNumber.format(remaining) + " GB";
  document.querySelector("#remaining-days").textContent = data.remainingDays == null ? "نامحدود" : persianNumber.format(data.remainingDays) + " روز";
  progress.hidden = unlimited;
  progress.setAttribute("aria-valuenow", String(percent));
  progress.style.setProperty("--progress", percent + "%");
  gauge.setAttribute("stroke-dasharray", percent + " 100");
  gauge.style.visibility = percent > 0 ? "visible" : "hidden";
}

function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.dataset.visible = "true";
  toastTimer = setTimeout(() => {
    toast.dataset.visible = "false";
    toast.textContent = "";
  }, 2400);
}

function copyWithSelection(value) {
  const previouslyFocused = document.activeElement;
  const field = document.createElement("textarea");
  field.value = value;
  field.readOnly = true;
  field.style.cssText = "position:fixed;inset:0 auto auto 0;opacity:0;pointer-events:none";
  document.body.append(field);
  field.select();
  field.setSelectionRange(0, value.length);

  try {
    return document.execCommand("copy");
  } catch {
    return false;
  } finally {
    field.remove();
    previouslyFocused?.focus({ preventScroll: true });
  }
}

async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value);
    return true;
  } catch {
    return copyWithSelection(value);
  }
}

async function handleCopy(button, value, message) {
  if (!value) {
    showToast("مقداری برای کپی در دسترس نیست.");
    return;
  }

  if (!await copyText(value)) {
    copyValue.value = value;
    if (!copyDialog.open) copyDialog.showModal();
    copyValue.select();
    return;
  }

  showToast(message);
  const icon = button.querySelector("use");
  const label = button.matches(".copy-button") ? button.querySelector("span") : null;
  clearTimeout(feedbackTimers.get(button));
  const title = button.querySelector("strong");
  if (title && !button.dataset.originalTitle) button.dataset.originalTitle = title.textContent;
  button.dataset.copied = "true";
  icon.setAttribute("href", "#check");
  if (label) label.textContent = "کپی شد";
  if (title) title.textContent = "کپی شد";

  feedbackTimers.set(button, setTimeout(() => {
    delete button.dataset.copied;
    icon.setAttribute("href", "#copy");
    if (label) label.textContent = "کپی";
    if (title) title.textContent = button.dataset.originalTitle;
    feedbackTimers.delete(button);
  }, 1800));
}

function daysLeft(timestamp) {
  return timestamp > 0 ? Math.max(0, Math.ceil((timestamp * 1000 - Date.now()) / 86400000)) : null;
}

function webUrl(value, protocols = ["https:", "http:"]) {
  if (!value) return "";
  try {
    const url = new URL(value, window.location.href);
    return protocols.includes(url.protocol) && !url.username && !url.password ? url.href : "";
  } catch {
    return "";
  }
}

renderSubscription(subscription);

for (const button of document.querySelectorAll("[data-link]")) {
  const value = webUrl(subscription.links[button.dataset.link]);
  if (!value) continue;
  button.hidden = false;
  button.addEventListener("click", () => handleCopy(button, value, "لینک کپی شد."));
}

const configList = document.querySelector(".config-list");
const configRow = document.querySelector("#config-row");
const counts = new Map();

for (const value of new Set(subscription.configs)) {
  const protocol = /^([a-z][a-z0-9+.-]*):\/\//i.exec(value)?.[1].toUpperCase();
  if (!protocol || ["HTTP", "HTTPS", "JAVASCRIPT", "DATA", "FILE"].includes(protocol)) continue;

  const count = (counts.get(protocol) ?? 0) + 1;
  counts.set(protocol, count);

  const row = configRow.content.cloneNode(true);
  const label = count === 1 ? protocol : protocol + " " + persianNumber.format(count);
  row.querySelector("bdi").textContent = label;
  const button = row.querySelector("button");
  button.setAttribute("aria-label", "کپی کانفیگ " + label);
  button.addEventListener("click", () => handleCopy(button, value, "کانفیگ کپی شد."));
  configList.append(row);
}

document.querySelector(".configs").hidden = !configList.childElementCount;

const supportUrl = webUrl(subscription.supportUrl, ["https:", "http:", "mailto:"]);
if (supportUrl) {
  document.querySelector(".site-footer").hidden = false;
  document.querySelector("#support-link").addEventListener("click", () => {
    window.location.assign(supportUrl);
  });
}

  </script>
